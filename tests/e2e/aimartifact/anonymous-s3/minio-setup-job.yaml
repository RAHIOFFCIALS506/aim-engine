apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mc
        image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
        command:
        - /bin/sh
        - -c
        - |
          #!/bin/sh
          set -e
          echo "Waiting for Minio to be ready..."
          until mc alias set myminio http://minio:9000 minioadmin minioadmin; do
            echo "Waiting for Minio..."
            sleep 2
          done
          echo "Creating bucket 'models'..."
          mc mb myminio/models || true
          echo "Seeding a tiny object tree..."
          mkdir -p /tmp/m
          head -c 100 /dev/zero > /tmp/m/config.json
          mc cp --recursive /tmp/m/ myminio/models/tree/
          echo "Making the bucket anonymously readable (list + get)..."
          mc anonymous set public myminio/models
          echo "Setup complete"
