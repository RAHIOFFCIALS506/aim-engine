apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: v1alpha2-aimmodel-invalid-version-contract
spec:
  description: |
    Verifies that the v1alpha2 AIMModel onboarding contract is enforced by CRD
    validation: spec.modelId is exclusive, while spec.image and spec.profiles
    may be combined for image-scoped derivation; legacy
    onboarding fields (profileCopy, custom, customTemplates, top-level
    modelSources) are rejected; spec.derivedFrom is rejected on new v1alpha2
    objects (deprecated flat shape); image-backed profiles reject user-supplied
    sourceRef/modelRef and disabled metadata extraction; profiles cannot be
    combined with aimId; the profiles version contract is enforced; and
    v1alpha1 keeps rejecting spec.derivedFrom, spec.profiles, and model-kind
    sourceRefs on deprecated profileCopy. The same image-backed contract is
    covered for AIMClusterModel.
  timeouts:
    assert: 30s
  steps:
    - name: Reject profiles latest policy with explicit version
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMModel
              metadata:
                name: invalid-profiles-latest-with-version
              spec:
                profiles:
                  derivedFrom:
                    selector:
                      aimId: invalid-org/invalid-model
                  versionPolicy: latest
                  version: 0.1.10

    - name: Reject profiles pinned policy without version
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMModel
              metadata:
                name: invalid-profiles-pinned-no-version
              spec:
                profiles:
                  derivedFrom:
                    selector:
                      aimId: invalid-org/invalid-model
                  versionPolicy: pinned

    - name: Reject v1alpha2 spec.profileCopy
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMModel
              metadata:
                name: invalid-profilecopy-v1alpha2
              spec:
                profileCopy:
                  selector:
                    aimId: invalid-org/invalid-model
                  versionPolicy: pinned
                  version: 0.1.0

    - name: Reject v1alpha2 spec.derivedFrom (deprecated flat shape)
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMModel
              metadata:
                name: invalid-derivedfrom-v1alpha2
              spec:
                derivedFrom:
                  selector:
                    aimId: invalid-org/invalid-model
                  versionPolicy: pinned
                  version: 0.1.0

    - name: Reject v1alpha2 spec.custom
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMModel
              metadata:
                name: invalid-custom-v1alpha2
              spec:
                image: quay.io/amd/aim-invalid:0.1.0
                # Well-typed spec.custom (cpu.requests is a Quantity, hardware
                # is an object) so the v1alpha2 forbidden-CEL fires instead of
                # type validation rejecting first. Pre-F2 fixture set
                # `hardware.cpu: "4"` directly, which violated AIMHardwareRequirements
                # (cpu is *AIMCpuRequirements, an object) and made this case
                # never reach the rule it claimed to test.
                custom:
                  hardware:
                    cpu:
                      requests: "4"

    - name: Reject v1alpha2 spec.customTemplates
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMModel
              metadata:
                name: invalid-custom-templates-v1alpha2
              spec:
                image: quay.io/amd/aim-invalid:0.1.0
                customTemplates:
                  - name: tpl

    - name: Reject v1alpha2 top-level spec.modelSources
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMModel
              metadata:
                name: invalid-top-level-modelsources-v1alpha2
              spec:
                image: quay.io/amd/aim-invalid:0.1.0
                modelSources:
                  - modelId: invalid-org/invalid-model
                    sourceUri: hf://invalid-org/invalid-model

    - name: Accept image-backed profiles
      try:
        - apply:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMModel
              metadata:
                name: valid-image-plus-profiles
              spec:
                image: quay.io/amd/aim-invalid:0.1.0
                discovery:
                  createServiceTemplates: false
                profiles:
                  derivedFrom:
                    selector:
                      acceleratorModel: MI300X
                      acceleratorCount: 1
                  versionPolicy: pinned
                  version: 0.1.0

    - name: Reject image-backed profiles with sourceRef
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMModel
              metadata:
                name: invalid-image-profiles-source-ref
              spec:
                image: quay.io/amd/aim-invalid:0.1.0
                profiles:
                  derivedFrom:
                    sourceRef:
                      name: alternate-cache
                    selector:
                      acceleratorModel: MI300X
                  versionPolicy: pinned
                  version: 0.1.0

    - name: Reject image-backed profiles with modelRef
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMModel
              metadata:
                name: invalid-image-profiles-model-ref
              spec:
                image: quay.io/amd/aim-invalid:0.1.0
                profiles:
                  derivedFrom:
                    selector:
                      acceleratorModel: MI300X
                      modelRef:
                        name: alternate-model
                  versionPolicy: pinned
                  version: 0.1.0

    - name: Reject image-backed profiles with metadata discovery disabled
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMModel
              metadata:
                name: invalid-image-profiles-no-discovery
              spec:
                image: quay.io/amd/aim-invalid:0.1.0
                discovery:
                  extractMetadata: false
                profiles:
                  derivedFrom:
                    selector:
                      acceleratorModel: MI300X
                  versionPolicy: pinned
                  version: 0.1.0

    - name: Accept cluster image-backed profiles
      try:
        - apply:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMClusterModel
              metadata:
                name: valid-cluster-image-plus-profiles
              spec:
                image: quay.io/amd/aim-invalid:0.1.0
                discovery:
                  createServiceTemplates: false
                profiles:
                  derivedFrom:
                    selector:
                      acceleratorModel: MI300X
                      acceleratorCount: 1
                  versionPolicy: pinned
                  version: 0.1.0

    - name: Reject cluster image-backed profiles with sourceRef
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMClusterModel
              metadata:
                name: invalid-cluster-image-profiles-source
              spec:
                image: quay.io/amd/aim-invalid:0.1.0
                profiles:
                  derivedFrom:
                    sourceRef:
                      name: alternate-cache
                    selector:
                      acceleratorModel: MI300X
                  versionPolicy: pinned
                  version: 0.1.0

    - name: Reject cluster image-backed profiles with modelRef
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMClusterModel
              metadata:
                name: invalid-cluster-image-profiles-model-ref
              spec:
                image: quay.io/amd/aim-invalid:0.1.0
                profiles:
                  derivedFrom:
                    selector:
                      acceleratorModel: MI300X
                      modelRef:
                        name: alternate-model
                  versionPolicy: pinned
                  version: 0.1.0

    - name: Reject cluster image-backed profiles with metadata discovery disabled
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMClusterModel
              metadata:
                name: invalid-cluster-image-profiles-no-discovery
              spec:
                image: quay.io/amd/aim-invalid:0.1.0
                discovery:
                  extractMetadata: false
                profiles:
                  derivedFrom:
                    selector:
                      acceleratorModel: MI300X
                  versionPolicy: pinned
                  version: 0.1.0

    - name: Reject profiles combined with aimId
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMModel
              metadata:
                name: invalid-aimid-plus-profiles
              spec:
                aimId: invalid-org/invalid-model
                profiles:
                  derivedFrom:
                    selector:
                      aimId: invalid-org/invalid-model
                  versionPolicy: pinned
                  version: 0.1.0

    - name: Reject v1alpha1 spec.derivedFrom
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMModel
              metadata:
                name: invalid-derivedfrom-v1alpha1
              spec:
                derivedFrom:
                  selector:
                    aimId: invalid-org/invalid-model
                  versionPolicy: pinned
                  version: 0.1.0

    - name: Reject v1alpha1 spec.profiles
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMModel
              metadata:
                name: invalid-profiles-v1alpha1
              spec:
                profiles:
                  derivedFrom:
                    selector:
                      aimId: invalid-org/invalid-model
                  versionPolicy: pinned
                  version: 0.1.0

    - name: Reject model catalog sourceRef on v1alpha1 profileCopy
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMModel
              metadata:
                name: invalid-model-source-ref-v1alpha1
              spec:
                profileCopy:
                  sourceRef:
                    kind: AIMModel
                    name: source-model
                  versionPolicy: all

    - name: Reject model catalog sourceRef on v1alpha1 cluster profileCopy
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMClusterModel
              metadata:
                name: invalid-cluster-model-source-ref-v1alpha1
              spec:
                profileCopy:
                  sourceRef:
                    kind: AIMClusterModel
                    name: source-cluster-model
                  versionPolicy: all
