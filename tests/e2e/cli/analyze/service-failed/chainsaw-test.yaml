# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# CLI Analyze Test: Service Failed
#
# Validates that `aim analyze service -o json` produces valid JSON
# diagnostics with AIM001 when the service references a non-existent model.
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cli-analyze-service-failed
spec:
  steps:
    - name: Create service referencing non-existent model
      try:
        - apply:
            file: service.yaml

    - name: Wait for service to report ModelNotFound
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMService
              metadata:
                name: test-service
              status:
                status: Failed
                (conditions[?type == 'ModelReady']):
                  - status: "False"
                    reason: ModelNotFound

    - name: Verify aim analyze JSON output contains AIM001
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              # aim analyze exits non-zero when diagnostics contain errors,
              # so capture stdout while tolerating the expected exit code.
              OUTPUT=$(aim analyze service test-service -n "$NAMESPACE" -o json) || true
              echo "$OUTPUT"
              echo "$OUTPUT" | jq -e 'length > 0'
              echo "$OUTPUT" | jq -e '.[0].code == "AIM001"'
              echo "$OUTPUT" | jq -e '.[0].severity == "Error"'
              echo "$OUTPUT" | jq -e '.[0].resource | contains("test-service")'
              echo "$OUTPUT" | jq -e '.[0].message | contains("Failed")'

    - name: Verify aim analyze text output
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              OUTPUT=$(aim analyze service test-service -n "$NAMESPACE") || true
              echo "$OUTPUT"
              echo "$OUTPUT" | grep -q "AIM001"
              echo "$OUTPUT" | grep -q "Error"
