apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMServiceTemplate
metadata:
  name: test-template
  annotations:
    aim.eai.amd.com/reconciliation-paused: "true"
spec:
  modelName: test-model
  hardware:
    gpu:
      model: MI300X
      requests: 1
  env:
    - name: HF_TOKEN
      value: template-token-value
    - name: HTTP_PROXY
      value: http://template-proxy:8080
status:
  status: Ready
  modelSources:
    - modelId: example/model
      sourceUri: hf://example/model
  resolvedHardware:
    gpu:
      requests: 1
      model: MI300X
  profile:
    metadata:
      type: optimized
      gpu: MI300X
      gpuCount: 1
